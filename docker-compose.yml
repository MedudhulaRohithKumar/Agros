version: '3.8'

services:
  backend:
    build: ./backend
    container_name: agros-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./agros_billing.db
      - JWT_SECRET_KEY=agros-prod-secret-2026-python314
    volumes:
      - ./backend/agros_billing.db:/app/agros_billing.db

  frontend:
    build: ./frontend
    container_name: agros-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional production MySQL service
  mysql:
    image: mysql:8.0
    container_name: agros-mysql
    profiles: ["mysql-storage"]
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: agros_billing
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
