service: agros-billing-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.14
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 30
  environment:
    DATABASE_URL: ${env:DATABASE_URL, 'sqlite:////tmp/agros_billing.db'}
    JWT_SECRET_KEY: ${env:JWT_SECRET_KEY, 'agros-secret-key-prod-2026'}

package:
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!__pycache__/**'
    - '!*.pyc'

functions:
  api:
    handler: lambda_handler.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
      - httpApi:
          path: /
          method: ANY
